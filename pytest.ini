[pytest]
# Only collect from tests/. Without this, pytest also picks up the throwaway
# test_connection.py in the project root, because its name starts with "test_".
testpaths = tests

# Show the reason for every skip/xfail and keep output compact
addopts = -ra

# Treat these as errors so a deprecation does not slip by unnoticed
filterwarnings =
    error::DeprecationWarning
    default
